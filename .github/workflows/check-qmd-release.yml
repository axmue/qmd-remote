name: check-qmd-release

# Spec D11: qmd-remote is pinned to an exact @tobilu/qmd version and reaches
# into its runtime surface (the store.internal.llm seam, dist/llm.js, the copied
# MCP tool definitions). A new upstream release is therefore a compatibility
# event, not a routine bump: this job runs the full compat suite against the new
# version and opens a PR only when everything is green. Never auto-merges.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Compare the pin with the latest release
        id: versions
        run: |
          pinned=$(node -p "require('./package.json').dependencies['@tobilu/qmd']")
          latest=$(npm view @tobilu/qmd version)
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$latest" ]; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          echo "pinned=$pinned latest=$latest"

      - name: Install the new qmd and run the compat suite
        id: compat
        if: steps.versions.outputs.new == 'true'
        continue-on-error: true
        run: |
          npm ci
          npm i --save-exact "@tobilu/qmd@${{ steps.versions.outputs.latest }}"
          npm run typecheck
          # Drift check is EXPECTED to fail on a bump (the copied MCP surface
          # must be re-reviewed) — it is reported, not gating.
          npm run check:mcp-drift || echo "mcp_drift=true" >> "$GITHUB_OUTPUT"
          npm test
          npm run test:consumer

      - name: Open a bump PR (green compat suite)
        if: steps.versions.outputs.new == 'true' && steps.compat.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bump-qmd-${{ steps.versions.outputs.latest }}
          title: "deps: bump @tobilu/qmd to ${{ steps.versions.outputs.latest }}"
          commit-message: "deps: bump @tobilu/qmd ${{ steps.versions.outputs.pinned }} → ${{ steps.versions.outputs.latest }}"
          body: |
            Automated compat check (spec D11).

            `@tobilu/qmd` ${{ steps.versions.outputs.pinned }} → **${{ steps.versions.outputs.latest }}**.
            Typecheck, the full suite (including the e2e seam proof) and the
            consumer gate all passed against the new version.

            Before merging, check manually:
            - [ ] `npm run check:mcp-drift` — re-sync `src/mcp.ts` if the copied
                  tool surface changed (drift reported: `${{ steps.compat.outputs.mcp_drift || 'none' }}`)
            - [ ] `dist/llm.js` still exports `LlamaCpp` (local jobs) and
                  `createStore` still assigns `internal.llm` (the seam)
            - [ ] the stock index locations in `src/store-remote.ts` still match
                  qmd's `getDefaultDbPath` / `getConfigDir` / `findLocalConfigPath`
          labels: dependencies

      - name: Open an issue (red compat suite)
        if: steps.versions.outputs.new == 'true' && steps.compat.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const latest = "${{ steps.versions.outputs.latest }}";
            const title = `@tobilu/qmd ${latest} breaks the compat suite`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "upstream" });
            if (existing.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["upstream"],
              body: `The weekly compat check failed against @tobilu/qmd ${latest} (pinned: ${{ steps.versions.outputs.pinned }}).\n\n` +
                    `Run log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `The pin stays where it is until this is resolved — qmd-remote keeps working for users on the pinned version.`,
            });
